[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tqem"
version = "1.0.0"
description = "Python library of the TQ Energy Manager build tools"
readme = "README.md"
license = "LicenseRef-TQSPSLA-1.0.3"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cyclonedx-python-lib[json-validation]>=11,<12",
    "packageurl-python>=0.17,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pylint==4.1.4", "pytest==9.2.0"]

[project.scripts]
tqem-fetch-app-sboms = "tqem.app_sboms:main"
tqem-bundle-sbom = "tqem.bundle_sbom:main"
tqem-go-sbom-licenses = "tqem.go_sbom_licenses:main"

[tool.setuptools]
packages = ["tqem"]

[tool.pylint.format]
max-line-length = 100
# The license header has longer lines
ignore-long-lines = "^#"
