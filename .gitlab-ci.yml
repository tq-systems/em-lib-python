include:
  # Include the SAST job early to prevent an override of the stages
  - project: devsecops/ci-components
    file: jobs/gitlab/sast.yml
    ref: v0.1.0
  - project: tq-em/public/build/base
    file: ci/include.yml
    ref: v4.1.0

variables:
  # Without it the SAST template runs in branch pipelines only, which base suppresses while an MR is open
  AST_ENABLE_MR_PIPELINES: "true"

# The base test image has no pip, the official Python image brings pip, venv and make
.python:
  stage: test
  extends: .gitlab-runner-tag
  image: python:3.12-bookworm

Python Linter:
  extends: .python
  script: make lint

Python Unit Tests:
  extends: .python
  script: make test

Gitleaks:
  extends: .gitleaks

# The SBOM tool entry carries the version from pyproject.toml, so the tag has to match it.
# bump-version.sh writes the version, a change means the release commit missed it.
Check Version:
  extends: .python
  rules:
    - if: $CI_COMMIT_TAG
  script: |
    ./bump-version.sh "$CI_COMMIT_TAG"
    if ! git diff --cached --quiet; then
      echo "Tag $CI_COMMIT_TAG does not match the version in pyproject.toml"
      exit 1
    fi

# The component brings the severity gate, only the runner tag is ours
semgrep-sast:
  extends: .gitlab-runner-tag
